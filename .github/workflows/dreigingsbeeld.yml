name: Dreigingsbeeld verzamelen

on:
  schedule:
    - cron: "7,27,47 * * * *"   # reserve als de keten onderbroken is
  workflow_dispatch:            # handmatig of door de keten

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: dreigingsbeeld
  cancel-in-progress: false

jobs:
  verzamelen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Bronnen ophalen
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 collector/collect.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publiceren:
    needs: verzamelen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  volgende:
    needs: [verzamelen, publiceren]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wachten en volgende run starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1200
          gh workflow run dreigingsbeeld.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}
